name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only: no deployment, no database access, no secrets of any kind.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # No CALL-E credentials are configured, so no call can be placed even if
      # something tried to. The live adapter refuses to construct without a key.
      CALLE_MODE: fake
      # In-process persistence: this job never reaches a Supabase project.
      KINCALL_PERSISTENCE: memory

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches package.json's engines.node lower bound.
          node-version: "20.9"
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      # The default lane only. `npm run test:integration` is deliberately NOT
      # run here: it truncates tables and requires a disposable database.
      - run: npm test

      - run: npm run build
